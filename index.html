<style>
/* BEGIN vendor:shell.css */
/* ecosystem/shell/shell.css v1.0.0
   Shared look for the Engineered by the Numbers tools. Palette and header,
   readout and footer patterns follow the Gear Train Workbench. Light theme is
   "drafting paper"; data-theme="dark" is "blueprint". Every colour a tool
   draws should come from these tokens (read them with app.pal()). */
:root, :root[data-theme="light"]{
  --paper:#F6F5F0; --grid-minor:#E7E5DC; --grid-major:#D8D5C8;
  --ink:#23272C; --ink-soft:#555B63; --line:#C9C6BA;
  --steel:#DCE1E6; --steel-edge:#7E8892;
  --dykem:#1D5FA8; --dykem-soft:#E3ECF7;
  --brass:#B08A2E; --brass-soft:#F5EBD2; --brass-ink:#7A5A16;
  --pass:#2E7D46; --fail:#B3402F; --warn:#8A5A00;
  --pos-fill:#DCE6F5; --neg-fill:#F6DDD8;
  --dro-bg:#1D2126; --dro-amber:#FFB000; --dro-label:#8B929B;
  --panel:#F1EFE8; --field:#ffffff; --rule:#B9B6AA; --th-bg:#EDEBE2;
  --scrim:rgba(35,39,44,.5); --badge-text:#ffffff;
  --font-ui:"Avenir Next","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0C2B4E; --grid-minor:#123659; --grid-major:#1A4771;
  --ink:#EAF2FB; --ink-soft:#A8C2DC; --line:#1E5183;
  --steel:#5E86AB; --steel-edge:#E4EFFA;
  --dykem:#5FD0E8; --dykem-soft:#123659;
  --brass:#FFC94D; --brass-soft:#2A2410; --brass-ink:#FFC94D;
  --pass:#57D493; --fail:#FF8A73; --warn:#FFC94D;
  --pos-fill:#1D4D7A; --neg-fill:#5A2E3A;
  --dro-bg:#071B31; --dro-amber:#FFC94D; --dro-label:#A8C2DC;
  --panel:#0F3157; --field:#123659; --rule:#1E5183; --th-bg:#123659;
  --scrim:rgba(3,15,28,.65); --badge-text:#08243F;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--dykem)}

/* ---------- Header / title block ---------- */
.sh-header{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:2px solid var(--ink);background:var(--paper);flex-wrap:wrap}
.titleblock{display:flex;flex-direction:column;line-height:1.15}
.titleblock .t1{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.titleblock .t2{font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;white-space:nowrap}
.modes{display:flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.modes button{font:600 12.5px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;padding:6px 11px;border:none;background:transparent;color:var(--ink);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.spacer{flex:1}
.namewrap{display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.namewrap input{font:15px var(--font-ui);border:none;border-bottom:1.5px solid var(--ink);background:transparent;padding:3px 4px;width:118px;color:var(--ink)}
.hbtns{display:flex;gap:5px;flex-wrap:wrap}
.hbtns button{font:600 12.5px var(--font-ui);letter-spacing:.02em;padding:6px 8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:3px;cursor:pointer}
.hbtns button:hover{background:var(--ink);color:var(--paper)}
.hbtns button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- Small-screen notice ---------- */
.sh-small{display:none;align-items:center;gap:10px;padding:6px 14px;background:var(--brass-soft);color:var(--ink);border-bottom:1.5px solid var(--brass);font-size:13px}
.sh-small button{margin-left:auto;border:1.5px solid var(--ink);background:transparent;border-radius:3px;padding:2px 8px;cursor:pointer}
@media (max-width:767.98px){ .sh-small:not([hidden]){display:flex} }

/* ---------- Main three-column layout ---------- */
.sh-main{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) 350px;min-height:0}
.sh-col{overflow-y:auto;min-height:0}
.sh-inputs{background:var(--panel);border-right:1.5px solid var(--line);padding:10px 12px 18px}
.sh-results{background:var(--panel);border-left:1.5px solid var(--line);padding:10px 12px 18px}
.sh-stage{padding:12px 14px;background-color:var(--paper);
  background-image:linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);
  background-size:20px 20px}
@media (max-width:1180px){ .sh-main{grid-template-columns:270px minmax(0,1fr) 310px} }
@media (max-width:1023.98px){
  body{overflow:auto}
  .sh-main{grid-template-columns:1fr;min-height:auto}
  .sh-col{overflow:visible}
  .sh-inputs,.sh-results{border:none;border-top:1.5px solid var(--line)}
  .sh-stage{order:-1}
}

/* ---------- Input panel ---------- */
.sec-h{font:700 12px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sec-h:first-child{margin-top:2px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) minmax(108px,auto);align-items:center;gap:4px 8px;margin:5px 0}
.fld>label,.fld>.lbl{font-size:13.5px;line-height:1.25}
.fld .ctl{display:flex;align-items:center;gap:4px}
.fld input[type=text],.fld select,.fld input[type=number]{width:80px;min-width:0;font:14px var(--font-mono);padding:4px 6px;border:1.5px solid var(--steel-edge);border-radius:3px;background:var(--field);color:var(--ink);text-align:right}
.fld select{text-align:left;font-family:var(--font-ui);font-size:13.5px;width:auto;max-width:176px}
.fld .unit{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.fld input[aria-invalid="true"]{border-color:var(--fail);border-width:2px}
.fld .err{grid-column:1/-1;font-size:12.5px;line-height:1.35;color:var(--fail);font-weight:600}
.fld .err:empty{display:none}
.fld .err::before{content:"⚠ "}
.fld.wide{grid-template-columns:1fr}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;margin:6px 0;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--dykem)}
.note{font-size:12.5px;line-height:1.45;color:var(--ink-soft);margin:6px 0}
.note.warn{color:var(--warn);font-weight:600}
.note.warn::before{content:"⚠ "}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btn{font:600 13px var(--font-ui);letter-spacing:.03em;padding:6px 10px;border:1.5px solid var(--ink);background:var(--field);color:var(--ink);border-radius:3px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--dykem);border-color:var(--dykem);color:var(--badge-text)}
.btn.small{padding:3px 7px;font-size:12px}
.btn.danger{border-color:var(--fail);color:var(--fail)}
.btn.danger:hover{background:var(--fail);color:var(--badge-text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{font:600 12.5px var(--font-ui);padding:4px 10px;border:none;background:var(--field);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.itemcard{border:1.5px solid var(--line);border-radius:4px;background:var(--field);padding:6px 8px;margin:6px 0}
.itemcard.sel{border-color:var(--dykem);box-shadow:0 0 0 1px var(--dykem)}
.itemcard .ih{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.itemcard .ih input{flex:1;min-width:0;font:600 13px var(--font-ui);border:none;border-bottom:1px dashed var(--line);background:transparent;padding:1px 2px}

/* ---------- Stage (drawing) ---------- */
.drawcard{background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;position:relative}
.drawcard svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.drawcard svg:focus-visible{outline:3px solid var(--dykem);outline-offset:-3px}
.cap{font-size:12.5px;line-height:1.45;color:var(--ink-soft);margin-top:6px}
.stationro{margin-top:8px;font:13px var(--font-mono);background:var(--field);border:1.5px solid var(--line);border-radius:3px;padding:6px 9px;min-height:2.2em}

/* ---------- Results ---------- */
.ro{width:100%;border-collapse:collapse;font-size:13.5px}
.ro th{text-align:left;font-weight:400;padding:4px 4px 4px 0;border-bottom:1px dotted var(--line);vertical-align:top}
.ro td{text-align:right;font:700 14px var(--font-mono);padding:4px 0;border-bottom:1px dotted var(--line);white-space:nowrap}
.ro td.wrap{white-space:normal}
.ro tr.sub th{padding-left:12px;color:var(--ink-soft)}
.masked{display:inline-block;min-width:3.2em;text-align:center;border:1.5px dashed var(--ink-soft);border-radius:3px;color:var(--ink-soft);font-weight:400}
.verdict{font-weight:700}
.verdict.pass{color:var(--pass)}
.verdict.fail{color:var(--fail)}
.verdict.pass::before{content:"✓ "}
.verdict.fail::before{content:"✗ "}
.verdict.info{color:var(--warn)}
.verdict.info::before{content:"● "}
.reason{font:italic 13px var(--font-ui);color:var(--ink-soft);white-space:normal}

/* ---------- Predict first ---------- */
.pfbox{margin-top:12px;border:1.5px solid var(--ink);border-left-width:5px;border-radius:3px;background:var(--field);padding:9px 10px}
.pfbox h3{font:700 12px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.pfrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 40px;gap:6px;align-items:center;margin:5px 0;font-size:13.5px}
.pfrow input{font:14px var(--font-mono);padding:4px 6px;border:1.5px solid var(--steel-edge);border-radius:3px;background:var(--field);color:var(--ink);text-align:right;width:100%}
.pfrow .unit{font-size:12px;color:var(--ink-soft)}
.pfmsg{font-size:13px;line-height:1.45;margin:5px 0;padding:5px 7px;border-left:3px solid var(--line);background:var(--panel)}
.pfmsg.match{border-left-color:var(--pass)}
.pfmsg.close{border-left-color:var(--brass)}
.pfmsg b{font-family:var(--font-mono)}
.pftag{font:700 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:2px;margin-left:4px}
.pftag.match{background:var(--pass);color:var(--badge-text)}
.pftag.close{background:var(--brass-ink);color:var(--badge-text)}

/* ---------- Show the working ---------- */
.working{margin-top:12px;border:1.5px solid var(--line);border-radius:3px;background:var(--field)}
.working>summary{cursor:pointer;padding:7px 10px;font:700 12px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.working[open]>summary{color:var(--ink);border-bottom:1px solid var(--line)}
.wk{list-style:none;padding:6px 10px 8px;counter-reset:wk}
.wk li{counter-increment:wk;padding:6px 0;border-bottom:1px dotted var(--line);font-size:13px;line-height:1.5}
.wk li:last-child{border-bottom:none}
.wk .wt{font-weight:700}
.wk .wt::before{content:counter(wk) ". "}
.wk .wf,.wk .ws{font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.wk .wr{font-family:var(--font-mono);font-weight:700}
.wk .wsrc{font-size:11.5px;color:var(--ink-soft);font-style:italic}

/* ---------- Dialogs ---------- */
dialog.sh-dlg{margin:auto;border:2px solid var(--ink);border-radius:5px;background:var(--paper);color:var(--ink);max-width:min(760px,94vw);width:100%;max-height:86vh;padding:0}
dialog.sh-dlg::backdrop{background:var(--scrim)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1.5px solid var(--line);position:sticky;top:0;background:var(--paper)}
.dlg-h h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;flex:1}
.dlg-b{padding:14px 18px 18px;overflow-y:auto}
.dlg-b h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px}
.dlg-b p,.dlg-b li{font-size:14.5px;line-height:1.6;margin-bottom:7px}
.dlg-b ul,.dlg-b ol{padding-left:22px;margin-bottom:8px}
.dlg-b table{border-collapse:collapse;font-size:13px;width:100%}
.dlg-b th,.dlg-b td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.dlg-b th{background:var(--th-bg);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.dlg-b td input{width:100%;min-width:60px;font:13px var(--font-mono);padding:2px 4px;border:1px solid var(--steel-edge);border-radius:2px;background:var(--field);color:var(--ink)}
.dlg-b textarea{width:100%;font:12.5px var(--font-mono);padding:6px;border:1.5px solid var(--steel-edge);border-radius:3px;background:var(--field);color:var(--ink)}
.teacher{margin-top:18px;padding:10px 12px;border:1.5px dashed var(--ink-soft);border-radius:3px}
kbd{font:12px var(--font-mono);border:1px solid var(--steel-edge);border-bottom-width:2px;border-radius:3px;padding:1px 5px;background:var(--field)}

/* ---------- Toast ---------- */
.sh-toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:14px var(--font-ui);padding:8px 16px;border-radius:4px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;z-index:60}
.sh-toast.on{opacity:1}

/* ---------- Footer (attribution block, identical across tools) ---------- */
.sh-footer{flex:0 0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;padding:6px 14px;border-top:1.5px solid var(--line);background:var(--panel);font-size:12px;color:var(--ink-soft)}
.sh-footer .foot-by{color:var(--ink)}
.sh-footer a{color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line)}
.sh-footer a:hover{color:var(--dykem);text-decoration-color:var(--dykem)}
.sh-footer .foot-by a{color:var(--ink)}
.sh-footer .foot-spacer{flex:1}
.sh-footer .foot-ai{width:100%;order:10}

/* ---------- Accessibility ---------- */
:focus-visible{outline:2px solid var(--dykem);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* ---------- Print report (always ink on paper) ---------- */
#sh-report{display:none}
@media print{
  @page{size:letter;margin:12mm}
  body>*:not(#sh-report){display:none !important}
  body{overflow:visible;height:auto;display:block;background:#fff;color:#000}

  #sh-report .fig svg{width:100%;height:auto;display:block}
  #sh-report .mono{font-family:var(--font-mono)}
  #sh-report .sig{margin-top:18px;font-size:11px}
  #sh-report .sig span{display:inline-block;border-top:1px solid #000;min-width:200px;padding-top:3px;margin-right:36px}
}
/* END vendor:shell.css */

.ldcard .ih .rm{margin-left:auto}
.ldcard .fld{margin:3px 0}

<script>
/* BEGIN vendor:prediction-log.js */
// ecosystem/prediction-log.js v1.1.0
// Prediction Log record format (spec 07 Part A). Pure functions, no DOM.
// Every tool writes records through this module so the Collector can merge them.
const PredictionLog = (function () {
  'use strict';
  const SCHEMA = 'prediction-log';
  const SCHEMA_VERSION = 1;
  const FIELDS = ['schema', 'schemaVersion', 'tool', 'toolVersion', 'student', 'team', 'classPeriod',
    'problemId', 'quantity', 'unit', 'predicted', 'model', 'measured', 'pctPredVsModel',
    'pctMeasVsModel', 'attempt', 'timestamp', 'inputs', 'note'];
  const NUMERIC = ['predicted', 'model', 'measured', 'pctPredVsModel', 'pctMeasVsModel'];
  const NEWER_WARNING = 'made by a newer tool version; some fields may be ignored';

  const isNum = v => typeof v === 'number' && isFinite(v);

  // (value − reference) ÷ reference × 100; null when either is missing or the reference is 0 (00 §3).
  function pctDiff(value, reference) {
    if (!isNum(value) || !isNum(reference) || reference === 0) return null;
    return (value - reference) / reference * 100;
  }

  // ISO 8601 local time with offset, e.g. 2026-09-27T14:03:09-05:00.
  function isoLocal(date) {
    const d = date || new Date();
    const p = n => String(Math.abs(Math.trunc(n))).padStart(2, '0');
    const off = -d.getTimezoneOffset();
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' +
      p(d.getMinutes()) + ':' + p(d.getSeconds()) + (off >= 0 ? '+' : '-') + p(off / 60) + ':' + p(off % 60);
  }

  // Short stable hash (FNV-1a, 32-bit) for sandbox problem IDs.
  function shortHash(obj) {
    const s = typeof obj === 'string' ? obj : stableStringify(obj);
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, '0').slice(0, 6);
  }
  function stableStringify(v) {
    if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
    return JSON.stringify(v);
  }
  const sandboxProblemId = inputs => 'sandbox-' + shortHash(inputs);

  // Attempt number for the next record: one more than the highest so far for
  // this student, problem and quantity.
  function nextAttempt(records, student, problemId, quantity) {
    let max = 0;
    for (const r of records) {
      if (r.student === student && r.problemId === problemId && r.quantity === quantity && r.attempt > max) max = r.attempt;
    }
    return max + 1;
  }

  function makeRecord(o) {
    const model = isNum(o.model) ? o.model : null;
    const measured = isNum(o.measured) ? o.measured : null;
    const rec = {
      schema: SCHEMA, schemaVersion: SCHEMA_VERSION,
      tool: String(o.tool || ''), toolVersion: String(o.toolVersion || ''),
      student: (o.student || '').trim() || 'unnamed',
      team: o.team || '', classPeriod: o.classPeriod || '',
      problemId: String(o.problemId || 'sandbox'),

      row.innerHTML = '<label for="' + o.id + '">' + o.label + '</label><span class="ctl"><select id="' + o.id + '"></select></span>';
      const sel = row.querySelector('select');
      const fill = () => {
        const opts = typeof o.options === 'function' ? o.options(app) : o.options;
        const html = opts.map(([v, l]) => '<option value="' + esc(v) + '">' + esc(l) + '</option>').join('');
        if (sel.innerHTML !== html) sel.innerHTML = html;
        sel.value = String(o.get(app));
      };
      fill();
      sel.addEventListener('change', () => { o.set(app, sel.value); app.changed(); });
      const field = { o, input: sel, row, sync: fill, reset: fill, revalidate() { } };
      app.fields.push(field);
      parent.appendChild(row);
      return field;
    };
    app.checkField = (parent, o) => {
      const row = h('label', { class: 'chk' }, '<input type="checkbox" id="' + o.id + '"> ' + o.label);
      const cb = row.querySelector('input');
      cb.checked = !!o.get(app);
      cb.addEventListener('change', () => { o.set(app, cb.checked); app.changed(); });
      const field = { o, input: cb, row, sync() { cb.checked = !!o.get(app); }, reset() { cb.checked = !!o.get(app); }, revalidate() { } };
      app.fields.push(field);
      parent.appendChild(row);
      return field;
    };
    app.removeFields = container => { app.fields = app.fields.filter(f => { if (container.contains(f.row)) { delete app.invalid[f.o.id]; return false; } return true; }); };
    app.hasInvalid = () => Object.keys(app.invalid).length > 0;
    app.invalidReason = () => 'not defined: fix the highlighted input' + (Object.keys(app.invalid).length > 1 ? 's' : '');

    /* =================================================================
       PREDICT FIRST (00 §4)
       ================================================================= */
    const pfOn = () => !!app.settings.predictFirst;
    app.masked = () => pfOn() && !app.pf.revealed;
    // Wrap a readout value: shows a blank box while hidden.
    app.show = (text) => app.masked() ? '<span class="masked" aria-label="hidden until you check your prediction">?</span>' : text;
    function clearPrediction() { app.pf.revealed = false; app.pf.fields = {}; app.pf.messages = []; }
    $('shPredict').addEventListener('click', () => {
      app.settings.predictFirst = !pfOn(); saveSettings(); clearPrediction(); render();
      app.announce(pfOn() ? 'Predict first is on. Results are hidden until you check a prediction.' : 'Predict first is off.');
    });
    function problemId() { return cfg.problemId ? cfg.problemId(app) : PL.sandboxProblemId(snapshot().values); }
    function snapshot() { return cfg.inputsSnapshot ? cfg.inputsSnapshot(app) : { values: {}, units: {} }; }
    function renderPf() {
      const box = app.el.pf;
      $('shPredict').setAttribute('aria-pressed', pfOn() ? 'true' : 'false');
      if (!pfOn()) { box.hidden = true; return; }
      box.hidden = false;
      const targets = cfg.predictTargets(app);
      const blocked = app.hasInvalid();
      let html = '<h3>Predict first</h3>';
      if (!app.pf.revealed) {
        html += '<p class="note">Enter your predictions, then press Check. Results stay hidden until you do.</p>';
        targets.forEach(t => {
          const id = 'shPf_' + t.key;
          html += '<div class="pfrow"><label for="' + id + '">' + t.label + '</label><input type="text" inputmode="decimal" id="' + id + '" data-key="' + esc(t.key) + '" value="' + esc(app.pf.fields[t.key] || '') + '" autocomplete="off"><span class="unit">' + esc(t.unit || '') + '</span></div>';
        });
        html += '<div class="btnrow"><button class="btn primary" id="shCheck" type="button"' + (blocked ? ' disabled' : '') + '>Check</button></div>';
        if (blocked) html += '<p class="note warn">Fix the highlighted input before checking.</p>';
      } else {
        app.pf.messages.forEach(m => { html += '<div class="pfmsg ' + (m.verdict || '') + '">' + m.html + '</div>'; });
        html += '<div class="btnrow"><button class="btn" id="shAgain" type="button">Predict again</button></div>';
      }
      box.innerHTML = html;
      box.querySelectorAll('input[data-key]').forEach(inp => inp.addEventListener('input', () => { app.pf.fields[inp.dataset.key] = inp.value; }));
      box.querySelectorAll('input[data-key]').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }));
      const c = $('shCheck'); if (c) c.addEventListener('click', check);
      const a = $('shAgain'); if (a) a.addEventListener('click', () => { clearPrediction(); render(); const f = box.querySelector('input'); if (f) f.focus(); });
    }
    function check() {
      if (app.hasInvalid()) return;
      const targets = cfg.predictTargets(app);
      const student = app.student() || 'unnamed';
      const pid = problemId(), snap = snapshot();
      const msgs = [], recs = [];
      for (const t of targets) {
        const raw = app.pf.fields[t.key];
        if (raw === undefined || String(raw).trim() === '') continue;
        const p = parseNumber(raw);
        if (!isNum(p)) { app.toast(t.label.replace(/<[^>]+>/g, '') + ': enter a number.'); document.getElementById('shPf_' + t.key).focus(); return; }
        const model = isNum(t.model) ? t.model : null;
        const rec = PL.makeRecord({
          tool: cfg.tool, toolVersion: cfg.version, student, team: app.settings.team, classPeriod: app.settings.classPeriod,
          problemId: pid, quantity: t.quantity || t.key, unit: t.unit || '', predicted: p, model, measured: t.measured,
          attempt: PL.nextAttempt(app.log, student, pid, t.quantity || t.key), inputs: snap,
        });
        recs.push(rec);
        const v = verdictFor(rec.pctPredVsModel, cfg.tolerance);
        const tag = v === 'match' ? ' <span class="pftag match">Match</span>' : v === 'close' ? ' <span class="pftag close">Close</span>' : '';
        msgs.push({ verdict: v === 'match' ? 'match' : v === 'close' ? 'close' : '', html: '<b>' + t.label + '</b>' + tag + '<br>' + esc(predictionMessage(p, model, t.unit, app.settings.sig, t.reason)) });
      }
      if (!recs.length) msgs.push({ html: 'No prediction was entered, so nothing was logged. The results are shown below.' });
      app.log = app.log.concat(recs); saveLog();
      app.pf.revealed = true; app.pf.messages = msgs;
      render();
      app.announce(msgs.map(m => m.html.replace(/<[^>]+>/g, ' ')).join(' '));
      const again = $('shAgain'); if (again) again.focus();
    }
    app.check = check;
    // Attach a measured value to this student's latest prediction of a quantity for the
    // current inputs (a target's `quantity`). Returns the updated record, or null when
    // there is no such prediction yet. A target can also carry `measured` at Check.
    app.recordMeasured = (quantity, measured) => {
      const res = PL.annotateLatest(app.log, { student: app.student() || 'unnamed', problemId: problemId(), quantity, tool: cfg.tool }, { measured });
      if (res.index < 0) return null;
      app.log = res.records; saveLog();
      return app.log[res.index];
    };

    /* =================================================================
       SHOW THE WORKING (00 §5)
       ================================================================= */
    app.setWorking = steps => { app.working = steps || []; };
    function renderWorking() {
      const body = app.el.working;
      if (app.masked()) { body.innerHTML = '<p class="note" style="padding:8px 10px">Hidden until you check your prediction.</p>'; return; }
      if (app.hasInvalid()) { body.innerHTML = '<p class="note" style="padding:8px 10px">' + esc(app.invalidReason()) + '.</p>'; return; }
      if (!app.working.length) { body.innerHTML = '<p class="note" style="padding:8px 10px">Nothing to show yet.</p>'; return; }
      body.innerHTML = '<ol class="wk">' + app.working.map(s =>
        '<li><div class="wt">' + s.title + '</div>' +
        (s.formula ? '<div class="wf">' + s.formula + '</div>' : '') +
        (s.sub ? '<div class="ws">= ' + s.sub + '</div>' : '') +
        (s.result ? '<div class="wr">= ' + s.result + '</div>' : '') +
        (s.note ? '<div class="note">' + s.note + '</div>' : '') +
        (s.source ? '<div class="wsrc">Source: ' + esc(s.source) + '</div>' : '') + '</li>').join('') + '</ol>';
    }

    /* =================================================================
       RENDER CYCLE
       ================================================================= */
    let saveT = 0;
    function saveState() { clearTimeout(saveT); saveT = setTimeout(() => S.set('state', { schemaVersion: cfg.schemaVersion, state: cfg.getState ? cfg.getState(app) : app.state }), 250); }
    function saveSettings() { S.set('settings', app.settings); }
    function saveLog() { S.set('log', app.log); }
    function render() {
      syncModes();
      app.fields.forEach(f => f.sync());
      cfg.render(app);
      renderPf();
      renderWorking();
    }
    app.render = render;
    // Call after any input change (00 §4.4: hides results and clears predictions).
    app.changed = (opts) => {
      if (!(opts && opts.keepPrediction) && pfOn()) clearPrediction();
      saveState(); render();
    };
    app.refreshFields = () => { app.fields.forEach(f => f.reset()); };

    /* =================================================================
       SAVE / LOAD / IMPORT (00 §6)
       ================================================================= */
    function context() { return cfg.context ? cfg.context(app) : 'sandbox'; }
    app.fileName = ext => exportName({ student: app.student(), tool: cfg.slug, context: context(), dateISO: localDateISO(), ext });
    $('shSave').addEventListener('click', () => {
      const f = SC.makeDesignFile({ tool: cfg.tool, toolVersion: cfg.version, schemaVersion: cfg.schemaVersion }, cfg.getState ? cfg.getState(app) : app.state);
      f.student = app.student();
      download(app.fileName('json'), JSON.stringify(f, null, 2), 'application/json');
      app.toast('Saved ' + app.fileName('json'));
    });
    $('shLoad').addEventListener('click', () => app.openFile());
    app.openFile = () => { $('shFile').value = ''; $('shFile').click(); };
    $('shFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) readFile(f); });
    document.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
    document.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); readFile(e.dataTransfer.files[0]); } });
    function readFile(file) {
      const r = new FileReader();
      r.onload = () => app.loadText(String(r.result), file.name);
      r.onerror = () => app.toast('That file could not be read.', 6000);
      r.readAsText(file);
    }
    app.loadText = (text, name) => {
      try {
        const kind = /\.csv$/i.test(name || '') ? 'prediction-log' : SC.kindOf(text);
        if (kind === 'design') {
          const res = SC.readDesignFile(text, { tool: cfg.tool, schemaVersion: cfg.schemaVersion, migrate: cfg.migrate });
          app.state = Object.assign(cfg.defaultState(), res.value.state);
          if (cfg.afterLoad) cfg.afterLoad(app);
          app.invalid = {};
          clearPrediction(); app.refreshFields(); saveState(); render();
          app.toast(res.warnings.length ? res.warnings.join(' ') : 'Loaded ' + (name || 'design') + '.', res.warnings.length ? 8000 : 3500);
          return { ok: true, warnings: res.warnings };
        }
        if (kind === 'prediction-log') {
          const res = PL.parseFile(name || 'log.json', text);
          const d = PL.dedupe(app.log.concat(res.records));
          const added = d.records.length - app.log.length;
          app.log = d.records; saveLog();
          app.toast('Added ' + added + ' prediction record' + (added === 1 ? '' : 's') + ' to your log.' + (res.warnings.length ? ' Note: ' + res.warnings.join(' ') : ''), 6000);
          return { ok: true };
        }
        if (kind && cfg.imports && cfg.imports[kind]) { cfg.imports[kind](app, text, name); return { ok: true }; }
        throw new Error(kind ? 'The ' + cfg.tool + ' cannot open a ' + kind + ' file.' : 'This file is not a design, import or prediction log this tool can read.');
      } catch (err) {
        app.toast(err.message, 8000);
        return { ok: false, error: err.message };
      }
    };
    app.download = download;

    /* =================================================================
       EXPORT IMAGE (00 §6): 2× PNG, ink on paper, caption strip
       ================================================================= */
    function drawingForExport() { return app.withLight(() => cfg.drawing(app, { export: true })); }
    function captionText() {
      return 'Name: ' + (app.student() || 'unnamed') + '   ·   ' + cfg.tool + '   ·   ' + (cfg.contextLabel ? cfg.contextLabel(app) : 'Sandbox') + '   ·   ' + localDateISO();
    }
    app.exportImage = () => new Promise((resolve, reject) => {
      const d = drawingForExport();
      const img = new Image();
      img.onload = () => {
        try {
          const scale = 2, capH = 40, W = d.width, H = d.height + capH;
          const c = document.createElement('canvas'); c.width = W * scale; c.height = H * scale;
          const x = c.getContext('2d'); x.scale(scale, scale);
          x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
          x.drawImage(img, 0, 0, d.width, d.height);
          x.strokeStyle = '#23272C'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(0, d.height + 0.75); x.lineTo(W, d.height + 0.75); x.stroke();
          x.fillStyle = '#23272C'; x.font = '600 13px "Avenir Next","Segoe UI",sans-serif'; x.textBaseline = 'middle';
          x.fillText(captionText(), 12, d.height + capH / 2);
          c.toBlob(blob => { download(app.fileName('png'), blob); resolve({ width: c.width, height: c.height }); }, 'image/png');
        } catch (e) { app.toast('The image could not be exported in this browser.', 6000); reject(e); }
      };
      img.onerror = () => { app.toast('The image could not be exported in this browser.', 6000); reject(new Error('svg load failed')); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(d.svg);
    });
    $('shPng').addEventListener('click', () => { app.exportImage().catch(() => { }); });

    /* =================================================================
       REPORT (00 §6): printable page
       ================================================================= */
    app.buildReport = () => {
      const d = drawingForExport();
      const r = cfg.report(app);
      const rows = list => list.map(([k, v]) => '<tr><th style="width:45%">' + k + '</th><td class="mono">' + v + '</td></tr>').join('');
      const session = app.log.filter(x => Date.parse(x.timestamp) >= app.sessionStart - 1000);
      const wk = app.masked() ? '<p>Hidden until the prediction is checked.</p>' : app.working.length ? '<table><tr class="hd"><th>#</th><th>Step</th><th>Formula</th><th>With numbers</th><th>Result</th><th>Source</th></tr>' +
        app.working.map((s, i) => '<tr><td>' + (i + 1) + '</td><td>' + s.title + '</td><td class="mono">' + (s.formula || '') + '</td><td class="mono">' + (s.sub || '') + '</td><td class="mono">' + (s.result || '') + '</td><td>' + esc(s.source || '') + '</td></tr>').join('') + '</table>' : '<p>Nothing to show.</p>';
      const hist = session.length ? '<table><tr class="hd"><th>Time</th><th>Quantity</th><th>Predicted</th><th>Model</th><th>Difference</th><th>Attempt</th></tr>' +
        session.map(x => '<tr><td>' + esc(x.timestamp.slice(11, 19)) + '</td><td>' + esc(x.quantity) + '</td><td class="mono">' + fmtSig(x.predicted, app.settings.sig) + ' ' + esc(x.unit) + '</td><td class="mono">' + (x.model === null ? 'not defined' : fmtSig(x.model, app.settings.sig) + ' ' + esc(x.unit)) + '</td><td class="mono">' + fmtPct(x.pctPredVsModel, app.settings.sig) + '</td><td>' + x.attempt + '</td></tr>').join('') + '</table>' : '<p>No predictions checked this session.</p>';
      const sources = (cfg.help && cfg.help.sources || []).map(s => '<li>' + esc(s.title) + (s.url ? ': ' + esc(s.url) : '') + '</li>').join('');
      report.innerHTML = '<div class="rb"><h1>' + esc(cfg.tool) + ' — Report</h1><div class="sub">' + esc(cfg.subtitle || '') + '</div>' +
        '<table><tr class="hd"><th>Name</th><th>Date</th><th>Mode</th><th>Tool version</th></tr><tr><td>' + esc(app.student() || 'unnamed') + '</td><td>' + localDateISO() + '</td><td>' + esc(cfg.contextLabel ? cfg.contextLabel(app) : 'Sandbox') + '</td><td>' + esc(cfg.version) + '</td></tr></table>' +
        '<div class="fig">' + d.svg + '</div>' +
        '<h2>Inputs</h2><table>' + rows(r.inputs) + '</table>' +
        '<h2>Results</h2><table>' + rows(r.outputs) + '</table>' +
        (r.notes && r.notes.length ? '<h2>Notes</h2><ul>' + r.notes.map(n => '<li>' + n + '</li>').join('') + '</ul>' : '') +
        '<h2>Show the working</h2>' + wk +
        '<h2>Prediction history (this session)</h2>' + hist +
        '<h2>Sources</h2><ol>' + sources + '</ol>' +
        '<div class="sig"><span>Student signature</span><span>Teacher check</span></div></div>';
      return report;
    };
    $('shReport').addEventListener('click', () => {
      app.buildReport();
      const prev = document.title;
      document.title = app.fileName('');
      document.title = document.title.replace(/\.$/, '');
      const restore = () => { document.title = prev; window.removeEventListener('afterprint', restore); };
      window.addEventListener('afterprint', restore);
      window.print();
      setTimeout(restore, 1500);
    });

    /* =================================================================
       PREDICTION LOG DIALOG (07 §3.3)
       ================================================================= */
    function renderLog() {
      const b = logD.body, sig = app.settings.sig;
      const recs = app.log.map((r, i) => ({ r, i })).reverse();
      b.innerHTML = '<p>Every Check in predict-first mode adds a row here. You can add a measured lab value and a note to any row. Records stay in this browser until you clear them in Settings.</p>' +
        '<div class="btnrow"><button class="btn" id="shLogJson">Export JSON</button><button class="btn" id="shLogCsv">Export CSV</button><button class="btn" id="shLogCopy">Copy last row</button></div>' +
        (recs.length ? '<div style="overflow-x:auto"><table><thead><tr><th>Time</th><th>Problem</th><th>Quantity</th><th>Predicted</th><th>Model</th><th>Diff.</th><th>Try</th><th>Measured</th><th>Note</th></tr></thead><tbody>' +
          recs.map(({ r, i }) => '<tr><td>' + esc(r.timestamp.slice(5, 16).replace('T', ' ')) + '</td><td>' + esc(r.problemId) + '</td><td>' + esc(r.quantity) + '</td><td>' + fmtSig(r.predicted, sig) + ' ' + esc(r.unit) + '</td><td>' + (r.model === null ? 'not defined' : fmtSig(r.model, sig)) + '</td><td>' + fmtPct(r.pctPredVsModel, sig) + '</td><td>' + r.attempt + '</td>' +
            '<td><input data-i="' + i + '" data-f="measured" inputmode="decimal" aria-label="Measured value for ' + esc(r.quantity) + '" value="' + (r.measured === null ? '' : r.measured) + '"></td>' +
            '<td><input data-i="' + i + '" data-f="note" aria-label="Note for ' + esc(r.quantity) + '" maxlength="200" value="' + esc(r.note) + '"></td></tr>').join('') + '</tbody></table></div>'
          : '<p class="note">No predictions yet. Turn on Predict first, enter a prediction and press Check.</p>');
      b.querySelectorAll('input[data-i]').forEach(inp => inp.addEventListener('change', () => {
        const i = +inp.dataset.i, f = inp.dataset.f;
        if (f === 'measured') { const v = inp.value.trim() === '' ? null : parseNumber(inp.value); if (v !== null && !isNum(v)) { app.toast('Measured value must be a number.'); return; } app.log[i] = PL.annotate(app.log[i], { measured: v }); }
        else app.log[i] = PL.annotate(app.log[i], { note: inp.value });
        saveLog(); renderLog();
      }));
      const logName = ext => exportName({ student: app.student(), tool: cfg.slug, context: 'prediction-log', dateISO: localDateISO(), ext });
      $('shLogJson').addEventListener('click', () => download(logName('json'), JSON.stringify(PL.toJSON(app.log), null, 2), 'application/json'));
      $('shLogCsv').addEventListener('click', () => download(logName('csv'), PL.toCSV(app.log), 'text/csv;charset=utf-8'));
      $('shLogCopy').addEventListener('click', async () => {
        if (!app.log.length) { app.toast('The log is empty.'); return; }
        const ok = await copyText(PL.toTSVRow(app.log[app.log.length - 1]));
        app.toast(ok ? 'Copied the last row. Paste it into your class spreadsheet.' : 'Copy did not work in this browser. Use Export CSV instead.');
      });
    }
    $('shLog').addEventListener('click', () => { renderLog(); logD.dlg.showModal(); });

    /* =================================================================
       SETTINGS, CLEAR MY DATA
       ================================================================= */
    function renderSettings() {
      const b = setD.body;
      b.innerHTML = '<h3>Numbers</h3><div class="fld"><label for="shSig">Significant figures shown</label><span class="ctl"><select id="shSig"><option value="3">3</option><option value="4">4</option></select></span></div>' +
        '<p class="note">Calculations are never rounded; this only changes the display.</p>' +
        '<h3>Your class</h3><div class="fld"><label for="shTeam">Team (optional)</label><span class="ctl"><input type="text" id="shTeam" maxlength="40" style="text-align:left"></span></div>' +
        '<div class="fld"><label for="shPeriod">Class period (optional)</label><span class="ctl"><input type="text" id="shPeriod" maxlength="20" style="text-align:left"></span></div>' +
        '<div id="shSetExtra"></div>' +
        '<h3>Your data</h3><p>Your name, current design, predictions and settings are kept in this browser only.</p>' +
        '<div class="btnrow"><button class="btn danger" id="shClear">Clear my data</button></div><p class="note" id="shClearMsg"></p>';
      $('shSig').value = String(app.settings.sig);
      $('shSig').addEventListener('change', () => { app.settings.sig = +$('shSig').value; saveSettings(); render(); });
      $('shTeam').value = app.settings.team; $('shPeriod').value = app.settings.classPeriod;
      $('shTeam').addEventListener('input', () => { app.settings.team = $('shTeam').value; saveSettings(); });
      $('shPeriod').addEventListener('input', () => { app.settings.classPeriod = $('shPeriod').value; saveSettings(); });
      if (cfg.settingsExtra) cfg.settingsExtra(app, $('shSetExtra'));
      let armed = false;
      $('shClear').addEventListener('click', () => {
        if (!armed) { armed = true; $('shClear').textContent = 'Click again to clear everything'; $('shClearMsg').textContent = 'This removes your name, design, prediction log and settings from this browser.'; return; }
        app.clearData(); setD.dlg.close();
      });
    }
    app.clearData = () => {
      clearTimeout(saveT);                      // a pending autosave must not write the old design back
      S.clearAll(); G.del('name');
      app.settings = Object.assign({ sig: 3, team: '', classPeriod: '', predictFirst: false }, cfg.defaultSettings || {});
      app.log = []; app.state = cfg.defaultState(); nameEl.value = ''; app.invalid = {};
      if (cfg.afterLoad) cfg.afterLoad(app);
      clearPrediction(); app.refreshFields(); render();
      app.toast('Your data was cleared from this browser.');
    };
    app.saveSettings = saveSettings;
    $('shSettings').addEventListener('click', () => { renderSettings(); setD.dlg.showModal(); });

    /* =================================================================
       HELP (00 §2)
       ================================================================= */
    function renderHelp() {
      const hp = cfg.help || {};
      const keys = (hp.keys || []).concat([['?', 'Open this help'], ['Esc', 'Close a dialog'], ['↑ / ↓ in a number box', 'Step the value (hold Shift for ×10)'], ['Enter in a prediction box', 'Check']]);
      helpD.body.innerHTML = (hp.html || '') +
        '<h3>Predict first</h3><p>Turn on <strong>Predict first</strong> in the header. The results you are asked to predict are hidden. Type a prediction for each one and press <strong>Check</strong>. The tool shows how far off you were and saves the attempt to your prediction log (<strong>Log</strong> button). Change any input and the results hide again. Within 1% counts as a match and within 5% as close. Open <strong>Show the working</strong> to see each step of the calculation and find where a prediction went wrong.</p>' +

      else if (k === 'Escape' && ui.placing) { ui.placing = false; app.render(); }
    });
  }
  function focusSvg() { const s = $('sbSvg'); if (s) s.focus({ preventScroll: true }); }

  /* ------------------------------------------------------------ loads list */
  function addLoad(app, a) {
    const s = app.state;
    if (s.loads.length >= T.MAX_LOADS) { app.toast('Version 1 allows up to ' + T.MAX_LOADS + ' loads.'); return; }
    const id = s.nextId++;
    s.loads.push({ id, label: 'Load ' + id, P: 1000, a });
    ui.sel = id;
    buildLoads(app); app.changed();
    app.announce('Added Load ' + id + ' at ' + app.fmt(a) + ' mm. Arrow keys move it.');
  }
  function removeLoad(app, id) {
    const s = app.state, l = byId(app, id);
    s.loads = s.loads.filter(x => x.id !== id);
    if (ui.sel === id) ui.sel = s.loads.length ? s.loads[0].id : null;
    buildLoads(app); app.changed();
    if (l) app.announce('Removed ' + l.label + '.');
  }
  function posCheck(v, app) {
    const s = app.state, [lo, hi] = T.range(s);
    if (v < lo || v > hi) return 'Load position must be between ' + U.fmtSig(lo, 4).replace('−', '-') + ' and ' + U.fmtSig(hi, 4) + ' mm.' + (s.overhang ? '' : ' Turn on overhangs to place a load beyond a support.');
    return null;
  }
  function buildLoads(app) {
    const box = $('sbLoads');
    app.removeFields(box);
    box.innerHTML = '';
    app.state.loads.forEach(l => {
      const card = document.createElement('div');
      card.className = 'itemcard ldcard' + (ui.sel === l.id ? ' sel' : '');
      card.dataset.id = l.id;
      card.innerHTML = '<div class="ih"><input type="text" maxlength="20" aria-label="Load name" value="' + esc(l.label) + '"><button class="btn small danger rm" type="button" aria-label="Remove ' + esc(l.label) + '">✕</button></div>';
      box.appendChild(card);
      const name = card.querySelector('input');
      name.addEventListener('input', () => { l.label = name.value.slice(0, 20) || 'Load'; app.changed({ keepPrediction: true }); });
      card.querySelector('.rm').addEventListener('click', () => removeLoad(app, l.id));
      card.addEventListener('focusin', () => { if (ui.sel !== l.id) { ui.sel = l.id; app.render(); } });
      app.numField(card, { id: 'ldP' + l.id, label: 'Force (+ down)', name: 'Load', unit: 'N', min: -20000, max: 20000, step: 10, get: () => l.P, set: (a, v) => { l.P = v; } });
      app.numField(card, { id: 'lda' + l.id, label: 'Position from A', name: 'Load position', unit: 'mm', step: 1, check: posCheck, get: () => l.a, set: (a, v) => { l.a = v; } });
    });
    $('sbAdd').disabled = app.state.loads.length >= T.MAX_LOADS;
  }

  /* ------------------------------------------------------------ import (§5.5) */
  let impDlg = null;
  function importShaftLoads(app, text, name) {
    const file = Schemas.readShaftLoads(text);
    const s = app.state, n = Math.min(file.value.loads.length, T.MAX_LOADS);
    const pos = T.defaultStations(n, s.L);
    if (!impDlg) { impDlg = document.createElement('dialog'); impDlg.className = 'sh-dlg'; impDlg.id = 'sbImport'; impDlg.setAttribute('aria-labelledby', 'sbImportT'); document.body.appendChild(impDlg); }
    impDlg.innerHTML = '<div class="dlg-h"><h2 id="sbImportT">Import shaft loads</h2><button class="btn small" data-close type="button">Cancel</button></div><div class="dlg-b">' +
      '<p>' + esc(file.value.loads.length) + ' load' + (file.value.loads.length === 1 ? '' : 's') + ' found in <strong>' + esc(name || 'the file') + '</strong> from the ' + esc(file.value.source) + '. Choose where each one sits along the shaft, measured from support A.</p>' +
      (file.multiPlane ? '<p class="note warn" id="sbImpWarn">' + esc(T.MULTIPLANE) + '</p>' : '') +
      file.warnings.map(w => '<p class="note warn">' + esc(w) + '</p>').join('') +
      '<table class="imp-table"><tr><th>Load</th><th>Force</th><th>Direction</th><th>Torque</th><th>Position (mm)</th></tr>' +
      file.value.loads.slice(0, n).map((l, i) => '<tr><td>' + esc(l.label) + '</td><td>' + app.fmtU(l.magnitude, 'N') + '</td><td>' + app.fmt(l.angleDeg) + '°</td><td>' + (l.torque === null ? '—' : app.fmtU(l.torque, 'N·m')) + '</td><td><input id="sbImpPos' + i + '" inputmode="decimal" value="' + pos[i] + '" aria-label="Position of ' + esc(l.label) + ' in mm"></td></tr>').join('') + '</table>' +
      '<label class="chk"><input type="checkbox" id="sbImpReplace" checked> Replace the loads already on the shaft</label>' +
      '<p class="note">Loads are placed by their magnitude, pushing down. Flip a sign afterwards if a load pushes up.</p>' +
      '<p class="note warn" id="sbImpErr" hidden></p>' +
      '<div class="btnrow"><button class="btn primary" id="sbImpGo" type="button">Place loads</button></div></div>';
    impDlg.querySelector('[data-close]').addEventListener('click', () => impDlg.close());
    impDlg.querySelector('#sbImpGo').addEventListener('click', () => {
      const [lo, hi] = T.range(s), vals = [];
      for (let i = 0; i < n; i++) {
        const v = U.parseNumber(impDlg.querySelector('#sbImpPos' + i).value);
        if (!isFinite(v) || v < lo || v > hi) { const e = impDlg.querySelector('#sbImpErr'); e.hidden = false; e.textContent = 'Each position must be between ' + lo + ' and ' + hi + ' mm.'; return; }
        vals.push(v);
      }
      const notes = T.importLoads(s, file, vals, impDlg.querySelector('#sbImpReplace').checked);
      s.importNotes = notes;
      ui.sel = s.loads.length ? s.loads[s.loads.length - 1].id : null;
      impDlg.close(); buildLoads(app); app.refreshFields(); app.changed();
      app.toast('Placed ' + vals.length + ' imported load' + (vals.length === 1 ? '' : 's') + '.');
    });
    impDlg.showModal();
  }

  /* ------------------------------------------------------------ results */
  function stationText(app) {
    if (!SOL || ui.station === null) return 'Click a diagram, or use the slider, to read values at a station.';
    if (app.masked()) return 'x = ' + app.fmt(ui.station) + ' mm. Values are hidden until you check your prediction.';
    const q = T.station(SOL, ui.station), s = app.state;
    const V = Math.abs(q.Vl - q.Vr) > 1e-9 ? app.fmt(q.Vl) + ' N left, ' + app.fmt(q.Vr) + ' N right' : app.fmt(q.Vr) + ' N';
    return 'x = ' + app.fmt(ui.station) + ' mm · V = ' + V + ' · M = ' + app.fmt(q.M) + ' N·m' +
      (s.mode === 'shaft' ? ' · T = ' + app.fmt(q.T) + ' N·m' : '') + ' · σ = ' + app.fmt(q.sigma) + ' MPa' +
      (s.mode === 'shaft' ? ' · τ = ' + app.fmt(q.tau) + ' MPa' : '') + ' · n = ' + (q.n === null ? 'not defined: no load here' : app.fmt(q.n));
  }
  function results(app) {
    const s = app.state, sol = SOL, sh = app.show, fu = app.fmtU;
    if (!sol) { app.el.results.innerHTML = '<div class="sec-h">Results</div><p class="reason">' + esc(app.invalidReason()) + '.</p>'; return; }
    const c = sol.crit;
    const rows = [];
    const row = (k, v, cls) => rows.push('<tr' + (cls ? ' class="' + cls + '"' : '') + '><th>' + k + '</th><td>' + v + '</td></tr>');
    row('Reactions R<sub>A</sub> / R<sub>B</sub>', sh(esc(fu(sol.RA, 'N')) + ' / ' + esc(fu(sol.RB, 'N'))));
    row('|M|<sub>max</sub>', sh(esc(fu(sol.MmaxAbs, 'N·m')) + ' at ' + esc(fu(sol.MmaxX, 'mm'))));
    if (s.mode === 'shaft') row('Torque T', esc(fu(sol.T, 'N·m')));
    if (c) {
      rows.push('<tr><th colspan="2" style="padding-top:8px"><strong>At the critical section</strong>' + (app.masked() ? '' : ' (x = ' + esc(fu(c.x, 'mm')) + ')') + '</th></tr>');
      row('M, T', sh(esc(fu(c.M, 'N·m')) + (s.mode === 'shaft' ? ', ' + esc(fu(c.T, 'N·m')) : '')), 'sub');
      row('σ (bending)', sh(esc(fu(c.sigma, 'MPa'))), 'sub');
      if (s.mode === 'shaft') row('τ (torsion)', sh(esc(fu(c.tau, 'MPa'))), 'sub');
      if (s.rule === 'vonMises') row('σ′ (von Mises)', sh(esc(fu(c.sigmaVM, 'MPa'))), 'sub');
      else row('τ<sub>max</sub> (Tresca)', sh(esc(fu(c.tauMax, 'MPa'))), 'sub');
      row('Safety factor n', sh('<span class="verdict ' + (sol.pass ? 'pass' : 'fail') + '">' + esc(app.fmt(sol.n)) + '</span> <span class="reason">' + (sol.pass ? 'meets' : 'below') + ' target ' + esc(app.fmt(s.nTarget)) + '</span>'));
    } else row('Safety factor n', '<span class="reason">not defined: ' + esc(sol.nReason) + '</span>');
    row('d for n = ' + esc(app.fmt(s.nTarget)), sol.dReq === null ? '<span class="reason">not defined: no load</span>' : sh(esc(fu(sol.dReq, 'mm'))));
    if (sol.defl) row('Max deflection', esc(fu(sol.defl.max, 'mm')) + ' at ' + esc(fu(sol.defl.x, 'mm')));
    const notes = [];
    if (!app.masked() && (sol.RA < 0 || sol.RB < 0)) notes.push('<p class="note warn">Bearing ' + (sol.RA < 0 ? 'A' : 'B') + (sol.RA < 0 && sol.RB < 0 ? ' and B' : '') + ': this bearing is pulled, not pushed.</p>');
    if (s.material !== 'custom') notes.push('<p class="note warn">Placeholder material value in use. Replace it with a datasheet or measured value.</p>');
    if (s.Kb > 1 || s.Kt > 1) notes.push('<p class="note">Shoulders, keyways and holes raise local stress. Factors of 2 or more are typical at keyways. Take values from a reference chart.</p>');
    (s.importNotes || []).forEach(n => notes.push('<p class="note warn">' + esc(n) + '</p>'));
    app.el.results.innerHTML = '<div class="sec-h">Results</div><table class="ro">' + rows.join('') + '</table>' +
      (sol.dReq !== null ? '<div class="btnrow"><button class="btn" id="sbUseD" type="button"' + (app.masked() ? ' disabled' : '') + '>Use this diameter' + (app.masked() ? '' : ' (' + esc(app.fmt(T.roundUpHalf(sol.dReq))) + ' mm)') + '</button></div>' : '') +
      notes.join('');
    const use = $('sbUseD');
    if (use) use.addEventListener('click', () => { s.d = T.roundUpHalf(sol.dReq); app.refreshFields(); app.changed(); app.toast('Diameter set to ' + app.fmt(s.d) + ' mm.'); });
  }

  /* ------------------------------------------------------------ help */
  const HELP = {
    html: '<p>Put bearings and loads on a shaft. The workbench draws the <strong>shear force</strong> and <strong>bending moment</strong> diagrams, the <strong>torque</strong> the shaft carries, the stresses, and the <strong>safety factor</strong> along the shaft. It also finds the <strong>diameter</strong> you need for a target safety factor.</p>' +
      '<h3>How to use it</h3><ol>' +
      '<li>Set the span <em>L</em> between support A (a pin) and support B (a roller). Turn on overhangs if a load sits beyond a bearing.</li>' +
      '<li>Add loads with <strong>+ Add load</strong>, then click the shaft. Drag a load arrow to move it, or type its position. Positive forces push down; negative forces push up.</li>' +
      '<li>In Shaft mode, enter the torque directly or as power and speed. The torque is carried between the <em>T in</em> and <em>T out</em> stations.</li>' +
      '<li>Choose the shaft diameter, the material\'s yield strength and your target safety factor.</li>' +
      '<li>Click any diagram to read the values at that station.</li></ol>' +
      '<h3>The method</h3><ol>' +
      '<li><strong>Reactions.</strong> Take moments about A: R<sub>B</sub> = Σ(P·a)/L. Then R<sub>A</sub> = ΣP − R<sub>B</sub>. A negative reaction means that bearing is pulled, not pushed.</li>' +
      '<li><strong>Shear and moment.</strong> V(x) adds up the forces to the left of x. M(x) adds up their moments about x. The moment is largest where the shear crosses zero, or at a support when there is an overhang.</li>' +
      '<li><strong>Torque.</strong> T = P/ω, with ω = 2πN/60.</li>' +
      '<li><strong>Stresses in a solid round shaft.</strong> σ = 32M/(πd³) and τ = 16T/(πd³). Doubling the diameter makes both 8 times smaller, because d is cubed.</li>' +
      '<li><strong>Safety factor.</strong> The maximum shear stress rule combines them: τ<sub>max</sub> = 16√(M² + T²)/(πd³), and n = S<sub>y</sub>/(2τ<sub>max</sub>). The tool checks every station, because the torque may not reach the point of largest moment.</li></ol>' +
      '<h3>Extension</h3><p>The extension options add stress concentration factors K<sub>b</sub> and K<sub>t</sub> (keyways, shoulders and holes), the distortion energy (von Mises) rule σ′ = √(σ² + 3τ²), and the deflected shape found by integrating M/(EI) twice. The shape is drawn exaggerated, and the drawing says by how much.</p>' +
      '<h3>Importing loads</h3><p><strong>Load</strong> (or <strong>Import shaft loads…</strong>) opens a shaft-loads file from the Gear Train Workbench or the Conveyor Designer. You choose where each load sits. Version 1 puts all loads in one plane. If the file\'s loads point in different directions, the tool says so.</p>',
    units: 'Lengths are in mm and forces in N. Moments show in N·m, and stresses in MPa (1 MPa = 1 N/mm²). 1 N·m = 1000 N·mm. Speed in rpm is multiplied by 2π/60 to get rad/s.',
    keys: [['Tab to the drawing', 'Then use the keys below'], ['A', 'Add a load at mid-span'], ['N / P', 'Select the next or previous load'], ['← / →', 'Move the selected load 1 mm (Shift: 10 mm)'], ['↑ / ↓', 'Change the selected load by 10 N (Shift: 100 N)'], ['Delete', 'Remove the selected load'], [', / .', 'Move the station readout 1 mm (Shift: 10 mm)'], ['Esc', 'Cancel placing a load']],
    teacher: '<p>The yield strength and modulus presets are <strong>placeholders</strong>. Replace them with datasheet or measured values for the stock your students use; the readout flags placeholders.</p>' +
      '<p>Version 1 models one solid round shaft of uniform diameter on a pin and a roller, with loads in one plane. Loads in two perpendicular planes (several gears pushing different ways), stepped and hollow shafts, fatigue and bearing life are left for a later version. When an imported file has loads in different directions the tool shows the warning and uses their magnitudes.</p>' +
      '<p>Predict first hides R<sub>A</sub>, |M|<sub>max</sub>, the critical safety factor and the required diameter, along with the moment peak label and every value that gives them away.</p>',
    sources: [
      { title: 'Optimal Beam, simply supported beam', url: 'https://optimalbeam.com/engineering-guides/simply-supported-beam' },
      { title: 'Omni Calculator, shaft size', url: 'https://www.omnicalculator.com/physics/shaft-size' },
      { title: 'Reuven Engineering Tools, shaft design', url: 'https://reuven.tools/tools/shaft-design/' },
      { title: 'Steltech, combined torsion and bending', url: 'https://steltech.co/en/genel-en/how-to-calculate-combined-torsion-and-bending-in-shafts/' },
      { title: 'Fiveable, shaft design and analysis', url: 'https://fiveable.me/elements-mechanical-engineering-design/unit-9/shaft-design-analysis/study-guide/AKaXbq1Ti6ao3oRz' },
      { title: 'Engineering Hulk, column buckling (I = πD⁴/64 for a solid circle)', url: 'https://engineeringhulk.com/mechanical/strength-of-materials/column-buckling/' },
      { title: 'OpenStax College Physics 2e, 9.2 The second condition for equilibrium', url: 'https://openstax.org/books/college-physics-2e/pages/9-2-the-second-condition-for-equilibrium' },
      { title: 'OpenStax University Physics Vol. 1, 10.8 Work and power for rotational motion', url: 'https://openstax.org/books/university-physics-volume-1/pages/10-8-work-and-power-for-rotational-motion' },
    ],
  };

  /* ------------------------------------------------------------ the tool */
  Shell.create({
    tool: 'Shaft and Beam Workbench', repo: 'ShaftBeamWorkbench', slug: 'shaft-beam-workbench', version: VERSION, schemaVersion: 1,
    subtitle: 'Engineering education · Shafts and beams',
    defaultState: T.defaultState,
    modes: { label: 'Mode', options: [{ id: 'shaft', label: 'Shaft' }, { id: 'beam', label: 'Beam' }], get: app => app.state.mode, set: (app, m) => { app.state.mode = m; } },
    contextLabel: app => 'Sandbox (' + (app.state.mode === 'shaft' ? 'Shaft' : 'Beam') + ' mode)',
    help: HELP,
    imports: { 'shaft-loads': importShaftLoads },
    afterLoad(app) {
      const s = app.state;
      if (!Array.isArray(s.loads)) s.loads = [];
      s.nextId = Math.max(s.nextId || 1, ...s.loads.map(l => l.id + 1), 1);
      ui.sel = s.loads.length ? s.loads[0].id : null;
      ui.station = null;
      if ($('sbLoads')) buildLoads(app);
    },
    build(app) {
      const I = app.el.inputs, F = T.FIELDS;
      const sec = (html, id) => { const d = document.createElement('div'); if (id) d.id = id; d.innerHTML = html; I.appendChild(d); return d; };
      // Supports and shaft
      const sup = sec('<div class="sec-h">Supports and shaft</div>');
      app.numField(sup, Object.assign({ id: 'sbL', label: 'Span L', step: 1, get: a => a.state.L, set: (a, v) => { a.state.L = v; } }, F.L));
      app.checkField(sup, { id: 'sbOv', label: 'Overhangs beyond the supports', get: a => a.state.overhang, set: (a, v) => { a.state.overhang = v; } });
      const ov = sec('', 'sbOvBox'); sup.appendChild(ov);
      app.numField(ov, Object.assign({ id: 'sbOL', label: 'Left overhang', step: 1, max: a => a.state.L, get: a => a.state.oL, set: (a, v) => { a.state.oL = v; } }, F.oL));
      app.numField(ov, Object.assign({ id: 'sbOR', label: 'Right overhang', step: 1, max: a => a.state.L, get: a => a.state.oR, set: (a, v) => { a.state.oR = v; } }, F.oR));
      app.numField(sup, Object.assign({ id: 'sbD', label: 'Diameter d', step: 0.5, get: a => a.state.d, set: (a, v) => { a.state.d = v; } }, F.d));
      app.selectField(sup, { id: 'sbMat', label: 'Material', options: T.MATERIALS.map(m => [m.id, m.label + (m.Sy ? ' (' + m.Sy + ' MPa)' : '')]), get: a => a.state.material, set: (a, v) => { const m = T.MATERIALS.find(x => x.id === v); a.state.material = v; if (m.Sy) { a.state.Sy = m.Sy; a.state.E = m.E; a.refreshFields(); } } });
      app.numField(sup, Object.assign({ id: 'sbSy', label: 'Yield strength S<sub>y</sub>', step: 10, get: a => a.state.Sy, set: (a, v) => { if (v !== a.state.Sy) a.state.material = 'custom'; a.state.Sy = v; } }, F.Sy));
      app.numField(sup, Object.assign({ id: 'sbN', label: 'Target safety factor n', step: 0.1, get: a => a.state.nTarget, set: (a, v) => { a.state.nTarget = v; } }, F.nTarget));
      // Loads
      const ld = sec('<div class="sec-h">Loads</div><div id="sbLoads"></div><div class="btnrow"><button class="btn" id="sbAdd" type="button">+ Add load</button><button class="btn" id="sbImp" type="button">Import shaft loads…</button></div><p class="note">Positive forces push down; negative forces push up. Up to ' + T.MAX_LOADS + ' loads.</p>');
      $('sbAdd').addEventListener('click', () => { ui.placing = true; app.render(); app.announce('Click the shaft to place the new load. Press Escape to cancel.'); });
      $('sbImp').addEventListener('click', () => app.openFile());
      // Torque
      const tq = sec('<div class="sec-h">Torque</div>', 'sbTq');
      app.selectField(tq, { id: 'sbTE', label: 'Enter torque as', options: [['power', 'Power and speed'], ['torque', 'Torque']], get: a => a.state.torqueEntry, set: (a, v) => { a.state.torqueEntry = v; } });
      const pw = sec('', 'sbPW'); tq.appendChild(pw);
      app.numField(pw, Object.assign({ id: 'sbP', label: 'Power P', step: 10, get: a => a.state.P, set: (a, v) => { a.state.P = v; } }, F.power));
      app.numField(pw, Object.assign({ id: 'sbNrpm', label: 'Speed N', step: 10, get: a => a.state.N, set: (a, v) => { a.state.N = v; } }, F.N));
      const td = sec('', 'sbTD'); tq.appendChild(td);
      app.numField(td, Object.assign({ id: 'sbT', label: 'Torque T', step: 0.1, get: a => a.state.T, set: (a, v) => { a.state.T = v; } }, F.T));
      const stCheck = (v, a) => { const [lo, hi] = T.range(a.state); return (v < lo || v > hi) ? 'Station must be between ' + lo + ' and ' + hi + ' mm.' : null; };
      app.numField(tq, { id: 'sbTin', label: 'T in at', name: 'Station', unit: 'mm', step: 1, check: stCheck, get: a => a.state.tFrom, set: (a, v) => { a.state.tFrom = v; a.state.tAuto = false; } });
      app.numField(tq, { id: 'sbTout', label: 'T out at', name: 'Station', unit: 'mm', step: 1, check: stCheck, get: a => a.state.tTo, set: (a, v) => { a.state.tTo = v; a.state.tAuto = false; } });
      sec('<p class="note" id="sbTAuto">T out follows the heaviest load until you set it.</p>').id = 'sbTAutoBox'; tq.appendChild($('sbTAutoBox'));
      // Extension
      const ex = sec('<div class="sec-h">Extension</div>');
      app.checkField(ex, { id: 'sbExt', label: 'Show extension options', get: a => a.state.extension, set: (a, v) => { a.state.extension = v; if (!v) { a.state.rule = 'tresca'; a.state.deflection = false; a.state.Kb = 1; a.state.Kt = 1; a.refreshFields(); } } });
      const exb = sec('', 'sbExtBox'); ex.appendChild(exb);
      app.selectField(exb, { id: 'sbRule', label: 'Failure rule', options: [['tresca', 'Maximum shear (Tresca)'], ['vonMises', 'Distortion energy (von Mises)']], get: a => a.state.rule, set: (a, v) => { a.state.rule = v; } });
      app.numField(exb, Object.assign({ id: 'sbKb', label: 'K<sub>b</sub> (bending)', name: 'K<sub>b</sub>', step: 0.1, get: a => a.state.Kb, set: (a, v) => { a.state.Kb = v; } }, F.K, { name: 'Kb' }));
      app.numField(exb, Object.assign({ id: 'sbKt', label: 'K<sub>t</sub> (torsion)', step: 0.1, get: a => a.state.Kt, set: (a, v) => { a.state.Kt = v; } }, F.K, { name: 'Kt' }));
      app.checkField(exb, { id: 'sbDef', label: 'Show the deflected shape', get: a => a.state.deflection, set: (a, v) => { a.state.deflection = v; } });
      app.numField(exb, Object.assign({ id: 'sbE', label: 'Elastic modulus E', step: 1, get: a => a.state.E, set: (a, v) => { if (v !== a.state.E) a.state.material = 'custom'; a.state.E = v; } }, F.E));
      // Stage
      app.el.stage.innerHTML = '<div class="drawcard" id="sbDraw"></div>' +
        '<div class="stationbar"><label for="sbSt">Read station</label><input type="range" id="sbSt" min="0" max="300" step="1"></div>' +
        '<div class="stationro" id="sbStRo" aria-live="polite"></div>' +
        '<p class="cap">The diagrams share one x axis, measured from support A. Drag a load arrow to move it. Click a diagram, or use the slider, to read values at a station.</p>';
      $('sbSt').addEventListener('input', () => { ui.station = +$('sbSt').value; app.render(); });
      wireDrawing(app);
      buildLoads(app);
    },
    render(app) {
      const s = app.state;
      // Keep dependent fields honest when span or overhang change (non-destructive: flag, don't move).
      app.fields.forEach(f => { if (/^(lda|sbTin|sbTout|sbOL|sbOR)/.test(f.o.id)) f.revalidate(); });
      if (s.tAuto && s.loads.length) s.tTo = T.heaviestStation(s);
      SOL = app.hasInvalid() ? null : T.solve(s);
      // Show and hide sections.
      $('sbOvBox').hidden = !s.overhang;
      $('sbTq').hidden = s.mode !== 'shaft';
      $('sbPW').hidden = s.torqueEntry !== 'power';
      $('sbTD').hidden = s.torqueEntry === 'power';
      $('sbTAutoBox').hidden = !s.tAuto;
      $('sbExtBox').hidden = !s.extension;
      $('sbE').closest('.fld').hidden = !s.deflection;
      document.querySelectorAll('#sbLoads .ldcard').forEach(c => c.classList.toggle('sel', +c.dataset.id === ui.sel));
      // Drawing
      const card = $('sbDraw');
      const hadFocus = document.activeElement && document.activeElement.id === 'sbSvg';
      card.innerHTML = draw(app).svg;
      card.classList.toggle('placing', ui.placing);
      if (ui.placing) card.insertAdjacentHTML('beforeend', '<div class="hint">Click the shaft to place the new load. Esc cancels.</div>');
      if (hadFocus) focusSvg();
      const [lo, hi] = T.range(s), st = $('sbSt');
      st.min = lo; st.max = hi;
      if (ui.station === null && SOL) ui.station = Math.round(SOL.MmaxX);
      if (ui.station !== null) { ui.station = Math.min(hi, Math.max(lo, ui.station)); st.value = ui.station; }
      $('sbStRo').textContent = stationText(app);
      results(app);
      app.setWorking(SOL ? T.working(SOL, app.fmt, app.fmtU) : []);
      app.describe(SOL ? T.describe(SOL, app.fmtU, app.masked()) : 'The drawing cannot update until the highlighted input is fixed.');
    },
    drawing: (app, opts) => draw(app, opts),
    predictTargets: app => SOL ? T.targets(SOL) : [],
    inputsSnapshot: app => T.snapshot(app.state),
    report(app) {
      const s = app.state, sol = SOL, fu = app.fmtU, m = app.masked();
      const hide = v => m ? 'hidden until checked' : v;
      const inputs = [['Mode', s.mode === 'shaft' ? 'Shaft (bending and torque)' : 'Beam (bending only)'], ['Span L', fu(s.L, 'mm')]];
      if (s.overhang) inputs.push(['Overhangs (left, right)', fu(s.oL, 'mm') + ', ' + fu(s.oR, 'mm')]);
      s.loads.forEach(l => inputs.push([esc(l.label), fu(l.P, 'N') + (l.P >= 0 ? ' down' : ' up') + ' at ' + fu(l.a, 'mm')]));
      if (s.mode === 'shaft') {
        inputs.push(['Torque', s.torqueEntry === 'power' ? fu(s.P, 'W') + ' at ' + fu(s.N, 'rpm') : fu(s.T, 'N·m')]);
        inputs.push(['Torque carried', 'from ' + fu(s.tFrom, 'mm') + ' to ' + fu(s.tTo, 'mm')]);
      }
      inputs.push(['Diameter d', fu(s.d, 'mm')], ['Yield strength S<sub>y</sub>', fu(s.Sy, 'MPa') + (s.material !== 'custom' ? ' (placeholder)' : '')], ['Target n', app.fmt(s.nTarget)], ['Failure rule', s.rule === 'vonMises' ? 'von Mises' : 'Tresca'], ['K<sub>b</sub>, K<sub>t</sub>', app.fmt(s.Kb) + ', ' + app.fmt(s.Kt)]);
      if (s.deflection) inputs.push(['Elastic modulus E', fu(s.E, 'GPa')]);
      const outputs = [];
      if (sol) {
        outputs.push(['R<sub>A</sub>, R<sub>B</sub>', hide(fu(sol.RA, 'N') + ', ' + fu(sol.RB, 'N'))], ['|M|<sub>max</sub>', hide(fu(sol.MmaxAbs, 'N·m') + ' at ' + fu(sol.MmaxX, 'mm'))]);
        if (s.mode === 'shaft') outputs.push(['T', fu(sol.T, 'N·m')]);
        if (sol.crit) {
          const c = sol.crit;
          outputs.push(['Critical section', hide(fu(c.x, 'mm'))], ['M, T there', hide(fu(c.M, 'N·m') + ', ' + fu(c.T, 'N·m'))], ['σ, τ', hide(fu(c.sigma, 'MPa') + ', ' + fu(c.tau, 'MPa'))],
            [s.rule === 'vonMises' ? 'σ′' : 'τ<sub>max</sub>', hide(fu(s.rule === 'vonMises' ? c.sigmaVM : c.tauMax, 'MPa'))], ['Safety factor n', hide(app.fmt(sol.n) + (sol.pass ? ' (meets target)' : ' (below target)'))]);
        } else outputs.push(['Safety factor n', 'not defined: ' + sol.nReason]);
        outputs.push(['Required d for n = ' + app.fmt(s.nTarget), sol.dReq === null ? 'not defined: no load' : hide(fu(sol.dReq, 'mm'))]);
        if (sol.defl) outputs.push(['Max deflection', fu(sol.defl.max, 'mm') + ' at ' + fu(sol.defl.x, 'mm')]);
      } else outputs.push(['Results', app.invalidReason()]);
      const notes = [];
      if (s.material !== 'custom') notes.push('Placeholder material value in use.');
      (s.importNotes || []).forEach(n => notes.push(esc(n)));
      return { inputs, outputs, notes };
    },
  });
})();
</script>
</body>
